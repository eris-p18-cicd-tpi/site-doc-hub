name: Build and Deploy

on:
  push:
    #paths:
     # - 'Dockerfile.*'
     # - 'public/**'
     # - '.github/workflows/**'
     # - '.gitlab-ci.yml'
    branches:
      - Main

env:
  WEBSERVER: mkdocs
  CI_REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  PROJECT_IMAGE: ghcr.io/${{ github.repository }}:mkdocs

jobs:
  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ secret.CI_DEPLOY_USER }}
          password: ${{ secret.CI_DEPLOY_PASSWORD }}

      - name: Build Docker image
        run: docker build -t $PROJECT_IMAGE -f Dockerfile.${WEBSERVER} .

      - name: Push Docker image
        run: docker push $PROJECT_IMAGE

      - name: Remove local image
        run: docker rmi $PROJECT_IMAGE

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker registry
        run: echo "${{ secrets.CI_DEPLOY_PASSWORD }}" | docker login -u "${{ secrets.CI_DEPLOY_USER }}" --password-stdin ghcr.io

      - name: Deploy with Docker Compose
        run: docker compose -f compose-prod.yml up -d

      - name: Logout from Docker registry
        run: docker logout ghcr.io

      - name: Notify
        run: echo "Success my bro 🎉"
